<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARaimundo | Cine Virtual</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .layout-principal {
            display: flex;
            width: 100%;
            max-width: 1600px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .columna-video {
            flex: 3;
            min-width: 300px;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #53f81e;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Columna del Chat */
        .columna-chat {
            flex: 1;
            min-width: 320px;
            background-color: #12141c;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2d2f34;
            display: flex;
            flex-direction: column;
            height: 700px;
            position: relative;
        }

        .columna-chat iframe {
            width: 100%;
            height: calc(100% - 60px);
            border: none;
        }

        .barra-login-chat {
            height: 60px;
            background-color: #191b1f;
            border-top: 1px solid #2d2f34;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            box-sizing: border-box;
        }

        .barra-login-chat span {
            font-size: 13px;
            color: #a0a0a0;
        }

        /* Panel de Información y Perfil */
        .panel-info {
            background-color: #191b1f;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border: 1px solid #2d2f34;
        }

        .cabecera-perfil {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .perfil-usuario {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar-perfil {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #53f81e;
        }

        .info-canal h1 {
            margin: 0;
            font-size: 26px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-canal p {
            color: #a0a0a0;
            margin: 5px 0 0 0;
            font-size: 14px;
        }

        .grupo-botones {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 700;
            text-decoration: none;
            text-align: center;
            font-size: 14px;
            transition: all 0.2s ease-in-out;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        .btn-follow { 
            background-color: #53f81e; 
            color: #000000; 
        }

        .btn-sub { 
            background-color: #2d2f34; 
            color: #ffffff; 
            border: 1px solid #53f81e; 
        }

        .btn-gift { 
            background-color: #2d2f34; 
            color: #ffffff; 
            border: 1px solid #3d4046;
        }

        .acerca-de {
            border-top: 1px solid #2d2f34;
            padding-top: 18px;
        }
        
        .acerca-de h2 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 10px;
            color: #ffffff;
        }
        
        .acerca-de p {
            color: #d0d0d0;
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        .view-farmer {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0.01;
            pointer-events: none;
            bottom: 0;
        }

        @media (max-width: 900px) {
            .layout-principal { flex-direction: column; }
            .columna-chat { height: 500px; }
            .cabecera-perfil { flex-direction: column; align-items: flex-start; }
            .grupo-botones { width: 100%; }
            .btn { flex: 1; min-width: 120px; }
        }
    </style>
</head>
<body>

    <div class="layout-principal">
        
        <!-- COLUMNA IZQUIERDA: VIDEO Y PERFIL -->
        <div class="columna-video">
            
            <!-- REPRODUCTOR CONECTADO A VDO.NINJA DESDE OBS -->
            <div class="video-container">
                <iframe 
                    src="https://vdo.ninja/?view=QdfgYmS&bitrate=20000&stereo&label=ARaimundolive" 
                    allow="autoplay; camera; microphone; fullscreen" 
                    allowfullscreen>
                </iframe>
            </div>

            <!-- PANEL DE INFORMACIÓN, BOTONES Y ACERCA DE -->
            <div class="panel-info">
                <div class="cabecera-perfil">
                    
                    <!-- FOTO DE PERFIL + NOMBRE Y SUBTÍTULO -->
                    <div class="perfil-usuario">
                        <img src="https://files.catbox.moe/o3jydx.jpg" alt="ARaimundo" class="avatar-perfil" onerror="this.src='https://kick.com/favicon.ico'">
                        <div class="info-canal">
                            <h1>ARaimundo</h1>
                            <p>Transmisión Alternativa / Alternative Transmission</p>
                        </div>
                    </div>
                    
                    <!-- BOTONES DE ACCIÓN DIRECTA DE KICK -->
                    <div class="grupo-botones">
                        <a href="https://kick.com/araimundo/about" target="_blank" class="btn btn-follow">💚 Seguir / Follow</a>
                        <a href="https://kick.com/araimundo/about" target="_blank" class="btn btn-sub">⭐ Suscribirse / Subscribe</a>
                        <a href="https://kick.com/araimundo/about" target="_blank" class="btn btn-gift">🎁 Regalar Subs / Gift Subs</a>
                    </div>
                </div>

                <!-- SECCIÓN ACERCA DE ARAIMUNDO -->
                <div class="acerca-de">
                    <h2>Acerca de ARaimundo / About ARaimundo</h2>
                    <p>Let's see what happens... let's talk about WWE, UFC, European Football & Running</p>
                </div>
            </div>
        </div>

        <!-- COLUMNA DERECHA: CHAT CON BARRA DE AUTENTICACIÓN -->
        <div class="columna-chat">
            <iframe 
                id="kick-chat-iframe"
                src="https://kick.com/popout/araimundo/chat" 
                allowfullscreen>
            </iframe>
            
            <div class="barra-login-chat">
                <span>¿No ves el chat o necesitas loguearte?</span>
                <button onclick="abrirLoginKick()" class="btn btn-follow" style="padding: 6px 12px; font-size: 12px;">
                    🔑 Iniciar Sesión en Kick
                </button>
            </div>
        </div>

    </div>

    <!-- REPRODUCTOR OFICIAL DE KICK (OCULTO) PARA SUMAR ESPECTADORES -->
    <div class="view-farmer">
        <iframe src="https://player.kick.com/araimundo?muted=true" allowfullscreen></iframe>
    </div>

    <script>
        function abrirLoginKick() {
            // Abre la ventana oficial de chat de Kick para iniciar sesión
            const ventanaLogin = window.open(
                'https://kick.com/popout/araimundo/chat', 
                'KickChatLogin', 
                'width=450,height=650,scrollbars=yes,resizable=yes'
            );
            
            // Recarga el iframe del chat cuando el usuario completa el login
            const timer = setInterval(() => {
                if (ventanaLogin.closed) {
                    clearInterval(timer);
                    document.getElementById('kick-chat-iframe').src = document.getElementById('kick-chat-iframe').src;
                }
            }, 1000);
        }
    </script>

</body>
</html>
